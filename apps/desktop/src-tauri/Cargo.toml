[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-fs = "2.7.0"
hound = "3"
sysinfo = "0.39"
sha2 = "0.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
  "http2",
] }
tokio = { version = "1", features = ["fs", "io-util"] }
whisper-rs-sys = "0.15"
keyring = "4"

# whisper.cpp for CrisperWhisper: Metal on macOS, CPU elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
