<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A microphone whose capsule is made of the speaker's voice. Surface mirrors the primary Button: top-lit gradient, inset ink ring, fading white hairline. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#1B2030" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B2030" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="104" x2="0" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="#427FF7"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#lit)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shade)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="916" width="824" height="8" fill="#1B2030" fill-opacity="0.06"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="186" fill="none" stroke="#1B2030" stroke-opacity="0.35" stroke-width="8"/>
  <rect x="111" y="111" width="802" height="802" rx="179" fill="none" stroke="url(#hairline)" stroke-width="6"/>
  <g fill="#FFFFFF">
    <rect x="304" y="342" width="64" height="176" rx="32"/>
    <rect x="392" y="280" width="64" height="300" rx="32"/>
    <rect x="480" y="244" width="64" height="372" rx="32"/>
    <rect x="568" y="280" width="64" height="300" rx="32"/>
    <rect x="656" y="342" width="64" height="176" rx="32"/>
  </g>
  <path d="M512 660 V772 M392 772 H632" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
</svg>
