# Web app + API. In Netlify, set the site's Base directory to apps/web; this
# file is read from there. Server routes, oRPC and the Inngest endpoint run as
# Netlify Functions via @netlify/vite-plugin-tanstack-start (which also reads
# this file during `vite dev`). Environment variables are set in the Netlify
# UI (docs/DEPLOYMENT.md).

[build]
command = "bun run build"
publish = "dist/client"

[build.environment]
BUN_VERSION = "1.3.4"

# Only production deploys migrate the production database; deploy previews
# should point DATABASE_URL at a Neon branch (set per context in the UI).
[context.production]
command = "bun run db:migrate && bun run build"
